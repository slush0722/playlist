<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pascal Playlist</title>
  <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="assets/icons/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-startup-image" href="/assets/icons/splash-640x1136.png" media="(device-width: 320px) and (device-height: 568px)" />

  <!-- Open Graph (OG) 메타 태그 -->
  <meta property="og:title" content="Pascal Playlist 🎧" />
  <meta property="og:description" content="청아인이 개발한 비공식 음원사이트!" />
  <meta property="og:image" content="https://cdn.discordapp.com/attachments/1164303125205749846/1363437053051932768/start-background.png?ex=68060734&is=6804b5b4&hm=229355e991aad8e519746bb5b8410bd8e3c3dcab44b4a3b4dd04798439c0ac1e&" />
  <meta property="og:url" content="https://pascalplaylist.netlify.app/" />
  <meta property="og:type" content="website" />

  <!-- 모바일 공통 스타일 -->
  <link rel="stylesheet" href="css/mobile-common.css" media="only screen and (pointer: coarse)">

  <!-- 모바일 가로 스타일 -->
  <link rel="stylesheet" href="css/mobile-landscape.css" media="only screen and (max-width: 1024px) and (orientation: landscape)">

  <!-- 모바일 세로 스타일 -->
  <link rel="stylesheet" href="css/mobile-portrait.css" media="only screen and (pointer: coarse) and (orientation: portrait)">
</head>
<body>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 제목 영역 -->
  <div class="header">
    <h1 id="playlist-title">Playlist</h1> <!-- 상단 타이틀 텍스트 -->
  </div>

  <div class="hideable">
    <!-- 재생 시간 표시 영역 -->
    <div id="time-box" class="time-box"> </div>
    <div id="clock-box" class="time-box"></div>

    <!-- 대기열 표시 영역 -->
    <div id="queueContainer" class="queue-container">
      <div class="queue-title-bar">
        <span class="queue-title">         대기열 [📼]</span>
        
        <div class="tooltip-wrapper">
          <button id="clearQueueBtn" class="clear-queue-btn">🗑️</button>
          <div class="tooltip">전체삭제</div>
        </div>
      </div>
      <div id="queueList" class="queue-list"></div>
    </div>    

    <!-- 전체 메인 컨테이너 -->
    <div class="main-container">

      <div class="icon-column-wrapper">
        <div class="icon-title-bar">
          <button class="arrow-button" id="prevBtn">⬅️</button>
          <div class="icon-title" id="title">인스타 감성</div>
          <button class="arrow-button" id="nextBtn">➡️</button>
        </div>
      
        <div class="icon-grid" id="iconGrid"></div>
      </div>

    <!-- 오디오 재생을 위한 audio 요소 (보이지 않음) -->
    <audio id="myAudio"></audio>

    <!-- 곡 이름 표시 바 -->
    <div id="trackInfoBar" class="track-info-bar">재생 중: 없음</div>
  </div>

    <div class="audio-controls">
      <button id="rewindBtn">⏪</button> <!-- 10초 뒤로 -->
      <button id="playPauseBtn">▶️</button>   <!-- 재생/일시정지 버튼 -->
      <button id="forwardBtn">⏩</button>  <!-- 10초 앞으로 -->
      <button id="skipBtn">⏭️</button>
      <button id="stopBtn">⏹️</button>        <!-- 정지 버튼 -->
      <button id="loopBtn">🔁</button>        <!-- 루프 재생 버튼 -->
      <button id="shuffleBtn">🎲</button>     <!-- 셔플 재생 버튼 -->
      <button id="autoShuffleBtn">♾️</button> <!-- 자동 랜덤 재생 -->
      <button id="toggleViewBtn">🟦</button>
    </div>
    <!-- 📑 패치노트 버튼 -->
    <a href="https://www.notion.so/Pascal-Playlist-1db851c963f18044b8edc30eff68b156?pvs=4" 
    id="patchNoteSideBtn"
    class="custom-tooltip"
    data-tooltip="패치노트"
    target="_blank">📑</a>

    <!-- 📗 곡 추천 버튼 -->
    <a href="https://tally.so/r/3EayVN" 
    id="recommendSideBtn"
    class="custom-tooltip"
    data-tooltip="곡 추천"
    target="_blank">📗</a>

  <!-- 이미지 회전용 구조 -->
  <div id="albumCoverWrapper">
    <div id="rotatingWrapper">
      <img id="rotatingIcon" src="assets/images/missing.png" alt="Rotating Album">
    </div>
    <img id="albumCoverImage" src="assets/images/missing.png" alt="Album Art">
  </div>

      <!-- 볼륨 조절 슬라이더 -->
  <div class="volume-control" style="font-family: 'Maplestory', sans-serif; font-weight: bold;">
    🔉 Volume: 
    <input type="range" id="volumeSlider" min="0.01" max="1" step="0.01" value="0.1">
    <!-- 슬라이더를 움직이면 JavaScript에서 볼륨이 조정됨 -->
  </div>
  
  <!-- 좌측 하단에 화살표 버튼 + 정보 박스 -->
  <div id="bottomLeftContainer" style="position: fixed; bottom: 30px; left: 40px; z-index: 9999;">
    <button id="toggleInfoBtn">⬆️</button>
    <div id="siteInfo">
      Version: 1.5.3<br>
      Visitors: <span id="visitorCount">0</span>
      Developer: Pascal345<br>
    </div>
    
    <div id="backgroundThumbnails" class="background-thumbs">
      <!-- 공통 배경 -->
      <img src="background.png" class="bg-thumb common-background" data-bg="background.png" />
    
      <!-- 데스크탑 전용 -->
      <img src="assets/images/background/background1.png" class="bg-thumb desktop-only" data-bg="assets/images/background/background1.png" />
      <img src="assets/images/background/background2.png" class="bg-thumb desktop-only" data-bg="assets/images/background/background2.png" />
      <img src="assets/images/background/background3.png" class="bg-thumb desktop-only" data-bg="assets/images/background/background3.png" />
      <img src="assets/images/background/background4.png" class="bg-thumb desktop-only" data-bg="assets/images/background/background4.png" />
      <img src="assets/images/background/background5.png" class="bg-thumb desktop-only" data-bg="assets/images/background/background5.png" />
      <img src="assets/images/background/background6.png" class="bg-thumb desktop-only" data-bg="assets/images/background/background6.png" />
      <img src="assets/images/background/background7.png" class="bg-thumb desktop-only" data-bg="assets/images/background/background7.png" />
    
      <!-- 모바일 전용 -->
      <img src="assets/images/background/mobile1.png" class="bg-thumb mobile-only" data-bg="assets/images/background/mobile1.png" />
      <img src="assets/images/background/mobile2.png" class="bg-thumb mobile-only" data-bg="assets/images/background/mobile2.png" />
      <img src="assets/images/background/mobile3.png" class="bg-thumb mobile-only" data-bg="assets/images/background/mobile3.png" />
      <img src="assets/images/background/mobile4.png" class="bg-thumb mobile-only" data-bg="assets/images/background/mobile4.png" />
      <img src="assets/images/background/mobile5.png" class="bg-thumb mobile-only" data-bg="assets/images/background/mobile5.png" />
      <img src="assets/images/background/mobile6.png" class="bg-thumb mobile-only" data-bg="assets/images/background/mobile6.png" />
    </div>
    </div>
  </div>

  <!-- 🎚️ Equalizer (hideable 밖 — f키 영향 안 받음) -->
  <div id="equalizerContainer" class="panel">
    <div class="eq-control-buttons" style="text-align:center; margin-top: 20px;">
      <button class="reset-eq-btn">🎛️</button>
      <button class="restore-eq-btn">🔄</button>
    </div>
    <h2>🎚️ Equalizer</h2>
    <div class="slider-row">
      <div class="slider-group">
        <label for="eq-bass">Bass</label>
        <input type="range" id="eq-bass" class="vertical-slider" min="-10" max="10" value="0">
        <span id="val-bass">0</span>
      </div>
      <div class="slider-group">
        <label for="eq-mid">Mid</label>
        <input type="range" id="eq-mid" class="vertical-slider" min="-10" max="10" value="0">
        <span id="val-mid">0</span>
      </div>
      <div class="slider-group">
        <label for="eq-treble">Treble</label>
        <input type="range" id="eq-treble" class="vertical-slider" min="-10" max="10" value="0">
        <span id="val-treble">0</span>
      </div>
    </div>
  </div>

  <!-- Bass Booster (hideable 밖) -->
  <div id="boosterContainer" class="panel">
    <div class="eq-control-buttons" style="text-align:center; margin-top: 20px;">
      <button class="reset-boost-btn">🎛️</button>
      <button class="restore-boost-btn">🔄</button>
    </div>
    <h2>Bass Booster</h2>
    <div class="booster-slider-group" style="display:flex; justify-content:center; align-items:flex-end; gap:40px; width:100%;">
      <div style="display:flex; flex-direction:column; align-items:center;">
        <label for="bass-boost">Boost</label>
        <input type="range" min="0" max="10" value="0" id="bass-boost" class="vertical-slider">
        <span id="val-boost">0</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center;">
        <label for="volume-boost">Volume</label>
        <input type="range" min="-10" max="10" value="1" step="1" id="volume-boost" class="vertical-slider">
        <span id="val-volboost">1</span>
      </div>
    </div>
  </div>

  <div id="bgOverlay"></div>

  <!-- 🎵 Spotify 패널 (왼쪽으로 열림) -->
  <div id="spotifyPanel" class="spotify-panel hidden-panel">

    <!-- 헤더 -->
    <div class="spotify-panel-header">
      <span class="spotify-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        Spotify
      </span>
      <div style="display:flex;gap:6px;align-items:center;">
        <span id="spotifyUserInfo" class="spotify-user-info" style="display:none;"></span>
        <button id="spotifyLoginBtn" class="spotify-login-btn">로그인</button>
        <button id="spotifyLogoutBtn" class="spotify-logout-btn" style="display:none;">로그아웃</button>
        <button id="spotifyCloseBtn" class="spotify-close-btn">✕</button>
      </div>
    </div>

    <!-- 로그인 전 안내 -->
    <div id="spotifyLoginPrompt" class="spotify-login-prompt">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="#1DB954" opacity="0.7"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
      <p>Spotify 계정으로 로그인하면<br>검색·내 플레이리스트를 이용할 수 있어요</p>
      <button class="spotify-login-big-btn" id="spotifyLoginBigBtn">Spotify로 로그인</button>
      <div class="spotify-divider"><span>또는 URL 직접 입력</span></div>
      <div class="spotify-input-row">
        <input id="spotifyUriInput" class="spotify-uri-input" type="text" placeholder="https://open.spotify.com/playlist/..." />
        <button id="spotifyLoadBtn" class="spotify-load-btn">▶</button>
      </div>
    </div>

    <!-- 로그인 후 메인 UI -->
    <div id="spotifyLoggedIn" style="display:none;">

      <!-- 탭 -->
      <div class="spotify-tabs">
        <button class="spotify-tab active" data-tab="search">검색</button>
        <button class="spotify-tab" data-tab="playlists">내 플레이리스트</button>
        <button class="spotify-tab" data-tab="saved">좋아요 곡</button>
      </div>

      <!-- 검색 탭 -->
      <div id="spotifyTabSearch" class="spotify-tab-content active">
        <div class="spotify-search-row">
          <input id="spotifySearchInput" class="spotify-uri-input" type="text" placeholder="곡, 아티스트, 플레이리스트 검색..." />
          <button id="spotifySearchBtn" class="spotify-load-btn">🔍</button>
        </div>
        <div id="spotifySearchResults" class="spotify-list"></div>
      </div>

      <!-- 내 플레이리스트 탭 -->
      <div id="spotifyTabPlaylists" class="spotify-tab-content">
        <div id="spotifyMyPlaylists" class="spotify-list"></div>
      </div>

      <!-- 좋아요 곡 탭 -->
      <div id="spotifyTabSaved" class="spotify-tab-content">
        <div id="spotifySavedTracks" class="spotify-list"></div>
      </div>
    </div>

    <!-- 공통 embed 영역 (항상 표시) -->
    <div id="spotifyEmbedArea" style="margin-top:10px;">
      <iframe id="spotifyEmbed"
        src=""
        width="100%"
        height="152"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        style="border-radius:10px; display:none;">
      </iframe>
      <p class="spotify-volume-note">🔇 볼륨·EQ는 Spotify 플레이어 내부에서 조절하세요<br>(iframe 보안 정책상 외부 슬라이더 연동 불가)</p>
    </div>
  </div>

  <!-- 🎵 Spotify 사이드 버튼 — script 위에 있어야 getElementById가 작동함 -->
  <button id="spotifySideBtn" class="spotify-side-btn" title="Spotify">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
  </button>

  <script src="sc.js"></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
